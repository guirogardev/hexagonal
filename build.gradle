plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.25.0'
	id 'com.google.protobuf' version '0.9.6'
}

group = 'es.tutoriales'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

openApiGenerate {
	generatorName.set('spring')
	inputSpec.set("$rootDir/api/rest/hexagonal.yaml")
	outputDir.set(
			layout.buildDirectory.dir('generated/openapi').get().asFile
	)

	configFile.set(
			layout.projectDirectory.file('api/rest/openapi-generator.yaml')
	)
}

sourceSets {
	main {
		java {
			srcDir(layout.buildDirectory.dir("generated/openapi/src/main/java"))
		}
		resources {
			srcDir("$rootDir/api")
		}
		proto {
			srcDir 'api/grpc'
		}
	}
}

protobuf {
	plugins {
		grpc {}
	}

	generateProtoTasks {
		all().configureEach {
			plugins {
				grpc {}
			}
		}
	}
}


compileJava.dependsOn(tasks.named("openApiGenerate"))

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.40'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.springframework.boot:spring-boot-h2console'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat-runtime'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
