spring:
  application:
    name: hexagonal

  datasource:
    url: jdbc:h2:file:./data/hexagonal
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      locations: file:./api/graphql/

  grpc:
    server:
      port: 9090